<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-Office Mijotons</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <header class="bg-red-500 text-white py-4">
        <h1 class="text-center text-2xl font-bold">Back-Office - Mijotons</h1>
        <p class="text-center">Gérez vos recettes facilement</p>
    </header>

    <main class="container mx-auto mt-8 p-4">
        <section class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4">Ajouter un nouveau plat</h2>
            <form action="add_dish.php" method="POST" class="space-y-4">
                <div>
                    <label for="dish-name" class="block text-sm font-medium text-gray-700">Nom du plat</label>
                    <input type="text" id="dish-name" name="name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Ex: Tarte aux pommes" required>
                </div>
                <div>
                    <label for="dish-description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="dish-description" name="description" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Ex: Une délicieuse tarte aux pommes avec une pâte croustillante..." required></textarea>
                </div>
                <div>
                    <label for="dish-image" class="block text-sm font-medium text-gray-700">Image (URL)</label>
                    <input type="url" id="dish-image" name="image_url" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Ex: https://via.placeholder.com/600x400" required>
                </div>
                <button type="submit" class="bg-red-500 text-white py-2 px-4 rounded-md hover:bg-red-600">Ajouter le plat</button>
            </form>
        </section>
    </main>
</body>
</html>
